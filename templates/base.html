<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titre %}Tickets{% endblock %} · Support informatique</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="bandeau">
    <a class="marque" href="{{ url_for('liste') }}"><span class="voyant"></span>support<b>/</b>tickets</a>
    <a class="bouton" href="{{ url_for('nouveau') }}">+ Nouveau ticket</a>
  </header>
  <main>
    {% for categorie, message in get_flashed_messages(with_categories=true) %}
      <p class="message {{ categorie }}" role="status">{{ message }}</p>
    {% endfor %}
    {% block contenu %}{% endblock %}
  </main>
</body>
</html>
